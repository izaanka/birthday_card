<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday</title>
  
  <!-- Google Fonts: Luxury Calligraphy & Editorial Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-vanilla-berry">
  <!-- Ambient Background Sparkles -->
  <div class="ambient-stars" aria-hidden="true"></div>

  <!-- Audio Toggle Button (SVG Icons - No Emojis) -->
  <button id="soundToggle" class="sound-toggle" aria-label="Toggle Sound" title="Sound is ON">
    <span class="sound-icon" id="soundIcon">
      <svg class="svg-sound-on" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg class="svg-sound-off hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </span>
    <span class="sound-text">Sound ON</span>
  </button>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <main class="app-container">
    <!-- ==============================================
         SCENE 1: THE BIRTHDAY CAKE & CANDLES
         ============================================== -->
    <section id="cakeScene" class="scene cake-scene active">
      <div class="cake-intro">
        <span class="sparkle-badge">Make A Wish</span>
        <h1 class="cake-title">Blow Out The Candles</h1>
        <p class="cake-hint" id="cakeHint">
          Tap, click, or swipe across each flame
        </p>
      </div>

      <!-- Cake Stage -->
      <div class="cake-stage" id="cakeStage">
        <!-- Dynamic Candles Row -->
        <div class="candles-container" id="candlesContainer">
          <!-- Injected via JavaScript from BIRTHDAY_CONFIG.candleCount -->
        </div>

        <!-- The CSS Art Cake -->
        <div class="cake" id="cake">
          <!-- Top Frosting Dollops -->
          <div class="frosting-dollops">
            <span class="dollop"></span>
            <span class="dollop"></span>
            <span class="dollop"></span>
            <span class="dollop"></span>
            <span class="dollop"></span>
          </div>

          <!-- Top Tier -->
          <div class="cake-tier tier-top">
            <div class="tier-frosting-drip"></div>
            <div class="tier-body">
              <div class="sprinkle s1"></div>
              <div class="sprinkle s2"></div>
              <div class="sprinkle s3"></div>
              <div class="sprinkle s4"></div>
            </div>
            <div class="tier-trim"></div>
          </div>

          <!-- Middle Frosting Belt -->
          <div class="frosting-belt"></div>

          <!-- Bottom Tier -->
          <div class="cake-tier tier-bottom">
            <div class="tier-frosting-drip drip-large"></div>
            <div class="tier-body">
              <div class="sprinkle s5"></div>
              <div class="sprinkle s6"></div>
              <div class="sprinkle s7"></div>
              <div class="sprinkle s8"></div>
              <div class="sprinkle s9"></div>
            </div>
            <div class="tier-trim"></div>
          </div>

          <!-- Cake Plate & Pedestal Stand -->
          <div class="cake-plate">
            <div class="plate-highlight"></div>
          </div>
          <div class="cake-pedestal"></div>
        </div>
      </div>

      <!-- Candles Status Badge -->
      <div class="candle-counter" id="candleCounter">
        <span class="counter-dot"></span>
        <span id="counterText">5 candles glowing</span>
      </div>
    </section>

    <!-- ==============================================
         SCENE 2: THE ELEGANT BIRTHDAY CARD
         ============================================== -->
    <section id="cardScene" class="scene card-scene hidden" aria-hidden="true">
      <div class="card-envelope-wrapper">
        <article class="birthday-card" id="birthdayCard">
          <!-- Decorative Corner Accents -->
          <div class="card-corner top-left">
            <svg viewBox="0 0 40 40" width="36" height="36">
              <path d="M 4,36 L 4,4 L 36,4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="10" cy="10" r="3" fill="currentColor"/>
              <path d="M 4,4 L 18,18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
            </svg>
          </div>
          <div class="card-corner top-right">
            <svg viewBox="0 0 40 40" width="36" height="36">
              <path d="M 36,36 L 36,4 L 4,4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="30" cy="10" r="3" fill="currentColor"/>
              <path d="M 36,4 L 22,18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
            </svg>
          </div>
          <div class="card-corner bottom-left">
            <svg viewBox="0 0 40 40" width="36" height="36">
              <path d="M 4,4 L 4,36 L 36,36" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="10" cy="30" r="3" fill="currentColor"/>
              <path d="M 4,36 L 18,22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
            </svg>
          </div>
          <div class="card-corner bottom-right">
            <svg viewBox="0 0 40 40" width="36" height="36">
              <path d="M 36,4 L 36,36 L 4,36" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="30" cy="30" r="3" fill="currentColor"/>
              <path d="M 36,36 L 22,22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
            </svg>
          </div>

          <!-- Card Header Decoration -->
          <div class="card-top-decor">
            <span class="decor-star">✦</span>
            <span class="decor-line"></span>
            <span class="decor-ornament">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
              </svg>
            </span>
            <span class="decor-line"></span>
            <span class="decor-star">✦</span>
          </div>

          <!-- Card Title & Recipient Name -->
          <h2 class="card-greeting" id="cardGreeting">Happy Birthday</h2>
          <div class="recipient-name-container">
            <span class="recipient-name" id="cardRecipient"></span>
          </div>

          <!-- Decorative Divider -->
          <div class="card-divider">
            <svg viewBox="0 0 200 20" width="160" height="16">
              <path d="M 0,10 Q 50,0 100,10 T 200,10" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="100" cy="10" r="3.5" fill="currentColor"/>
            </svg>
          </div>

          <!-- Personalized Message -->
          <div class="card-message-body" id="cardMessage">
            <!-- Injected via JavaScript from BIRTHDAY_CONFIG -->
          </div>

          <!-- Sender Signature -->
          <div class="card-signature" id="cardSignature">
            <!-- Injected via JavaScript from BIRTHDAY_CONFIG -->
          </div>

          <!-- Card Footer Action -->
          <div class="card-actions">
            <button id="relightBtn" class="btn-relight">
              <svg class="btn-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                <path d="M3 21v-5h5"/>
              </svg>
              <span class="btn-text">Make Another Wish</span>
            </button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <!-- Load Config First, then Application Logic -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
